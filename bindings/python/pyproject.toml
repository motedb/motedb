[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "motedb-python"
version = "0.12.0"
description = "AI-native embedded multimodal database — vectors, full-text, spatial, time-series in one ACID engine."
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[tool.maturin]
# Mixed layout: the Rust extension ships as motedb._native; the real Python
# package (motedb/__init__.py) wraps it with Arrow/pandas interop.
python-source = "python"
module-name = "motedb._native"
