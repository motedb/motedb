[package]
name = "motedb-node"
version = "0.15.2"
edition = "2021"
description = "Node.js bindings for MoteDB — AI-native embedded multimodal database."
license = "MIT"
repository = "https://github.com/motedb/motedb"
publish = false

[lib]
name = "motedb_node"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
base64 = "0.22"
motedb-core = { path = "../..", package = "motedb", default-features = false, features = [
    "parquet",
] }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
