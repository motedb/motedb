name: Build and Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Hard gate: library unit tests (fast, deterministic) ──────────────────
  # `cargo test --lib` compiles a SINGLE binary (429 in-crate tests) and runs
  # in ~5s. Same strategy as ci.yml's hard gate: catches the vast majority of
  # regressions deterministically. `publish` depends ONLY on this job.
  #
  # The full integration suite (`cargo test --workspace`) has an intermittent
  # background-thread deadlock (~90 binaries run serially → index-builder /
  # group-commit condvar permanent wait on CREATE INDEX + SELECT). Pre-existing
  # concurrency issue, not a regression; does not reproduce in isolation. It is
  # run as a separate advisory job below so its hang can never block a release
  # (v0.7.2/v0.7.3/v0.7.4 all hit CI timeouts from this before the split).
  unit-test:
    name: Unit tests (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo fetch
      - name: cargo test --lib --all-features
        env:
          CI: "1"
        run: cargo test --lib --all-features

  # 注：integration 测试由 ci.yml 的 integration-test job 覆盖（advisory，
  # 30min timeout）。publish.yml 不再重复跑 integration —— 全量 workspace 有
  # 间歇并发 race（深层、概率性），即使 advisory 也会让 Actions 页面长时间
  # 显示 in_progress。publish 仅依赖确定性的 unit-test（--lib，~5s）。

  publish:
    name: Publish to crates.io
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: cargo fetch

      - name: Build (release)
        run: cargo build --release

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG"
          VERSION=$(grep '^version' Cargo.toml | head -n1 | sed -E 's/version\s*=\s*"(.*)"/\1/')
          echo "Version from Cargo.toml: $VERSION"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag does not match version in Cargo.toml (v$VERSION expected). Aborting.";
            exit 1;
          fi

      - name: Package check
        # No --allow-dirty: the package must be clean so we never publish
        # uncommitted changes or stray working files to crates.io.
        run: cargo package

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_TOKEN is not set in repository secrets. Aborting."; exit 1;
          fi
          cargo publish
