name: Node SDK publish (npm)

# Multi-platform prebuilt napi binaries → npmjs.org (unscoped):
#   motedb (main, pure JS loader) + one platform package per target:
#   motedb-darwin-arm64 / -darwin-x64 / -linux-x64-gnu / -linux-arm64-gnu /
#   -win32-x64-msvc
# Triggers on v* tags (publish) and PRs touching the binding (build-only).
# 🔑 Publishing needs the NPM_TOKEN repository secret (an npmjs.org automation
#   token with publish rights on the motedb* packages). The publish job fails
#   fast with a clear message when it is missing.
# musl (Alpine) targets: the Alpine-container build step below is wired up but
#   the two matrix entries stay commented out until a PR run has proven them —
#   `publish` needs every matrix job green, so an unproven target must not be
#   able to block a release. Enable them together with the matching
#   package.json targets/optionalDependencies.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "bindings/node/**"
      - ".github/workflows/node-publish.yml"
  workflow_dispatch:

concurrency:
  group: node-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            target: aarch64-apple-darwin
          # x64-macOS via CROSS-COMPILE on the arm64 runner — macos-13
          # (Intel) runners are retiring and queue for an hour+; rust
          # cross-compiles x86_64-apple-darwin natively from arm64.
          - os: macos-latest # arm64 → cross x64
            target: x86_64-apple-darwin
          - os: ubuntu-latest # x64 gnu
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # musl: GitHub runners are glibc, so these build in the napi-rs
          # Alpine image (same recipe as the napi-rs project template; the
          # image carries the aarch64-linux-musl cross toolchain). Commented
          # out until proven by a PR run — see the header note.
          # - os: ubuntu-latest
          #   target: x86_64-unknown-linux-musl
          #   docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          # - os: ubuntu-latest
          #   target: aarch64-unknown-linux-musl
          #   docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.docker }}
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.docker }}
        with:
          workspaces: bindings/node
          key: ${{ matrix.target }}

      - name: Install napi CLI
        if: ${{ !matrix.docker }}
        working-directory: bindings/node
        run: npm install --no-save @napi-rs/cli@3.10.8

      - name: Build (napi layout)
        if: ${{ !matrix.docker }}
        working-directory: bindings/node
        shell: bash
        run: |
          set -e
          ARGS=(--release --platform --target ${{ matrix.target }} --js false --dts false)
          npx napi build "${ARGS[@]}"

      - name: Build (napi layout, musl in Alpine container)
        if: ${{ matrix.docker }}
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.docker }}
          options: -v ${{ github.workspace }}:/build -w /build/bindings/node -e CARGO_TERM_COLOR=always
          run: |
            set -e
            # 容器自带 Node 18, 而 @napi-rs/cli 的依赖树 (@inquirer/core) 已要求
            # Node≥20 (styleText) 且 --no-save 无锁文件每次拉最新 — 曾于 2026-10-20
            # 上游漂移打破构建。装固定版本的官方 musl Node, 消除漂移。
            NODE_ARCH=$(uname -m); [ "$NODE_ARCH" = "x86_64" ] && NODE_ARCH=x64
            NODE_VER=v22.14.0
            wget -qO- "https://nodejs.org/dist/$NODE_VER/node-$NODE_VER-linux-$NODE_ARCH-musl.tar.xz" \
              | tar xJ -C /usr/local --strip-components=1
            node -v | grep -Eq '^v2[2-9]' || { echo "node upgrade failed: $(node -v)"; exit 1; }
            rustup target add ${{ matrix.target }}
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
              # zstd-sys compiles C: point cc + the linker at the image's cross toolchain.
              export CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc
            fi
            npm install --no-save @napi-rs/cli@3.10.8
            npx napi build --release --platform --target ${{ matrix.target }} --js false --dts false
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
              node smoke_ci.js
            fi

      - name: Smoke (JS loader)
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: bindings/node
        shell: bash
        # smoke_ci.js is committed (also reused by scripts/release_smoke.sh);
        # it requires './index.js' FILE-relative, so run it from the package dir.
        run: node smoke_ci.js

      - name: Upload binding artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install napi CLI
        working-directory: bindings/node
        run: npm install --no-save @napi-rs/cli@3.10.8
      - name: Create npm dirs
        working-directory: bindings/node
        run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
      - name: Place binaries into npm dirs
        working-directory: bindings/node
        shell: bash
        # 🔑 Deterministic placement (napi artifacts misbehaves with
        # cross-compiled targets): match each downloaded .node against the
        # platform package's "main" field, copy, then verify completeness.
        run: |
          set -e
          for d in artifacts/bindings-*; do
            node_file=$(ls "$d"/*.node 2>/dev/null | head -1 || true)
            [ -n "$node_file" ] || { echo "no .node in $d"; ls -la "$d"; exit 1; }
            base=$(basename "$node_file")
            placed=0
            for pkg in npm/*/; do
              main=$(jq -r .main "${pkg}package.json")
              if [ "$main" = "$base" ]; then
                cp "$node_file" "$pkg"
                echo "placed $base -> $pkg"
                placed=1
              fi
            done
            [ "$placed" = 1 ] || { echo "no package wants $base"; exit 1; }
          done
          missing=0
          for pkg in npm/*/; do
            main=$(jq -r .main "${pkg}package.json")
            [ -f "$pkg/$main" ] || { echo "MISSING $pkg/$main"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          ls -R npm | head -40
      - name: Dry-run publish (structure validation only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: bindings/node
        shell: bash
        run: |
          set -e
          # pre-publish performs REAL npm publishes, so staging (PRs) only
          # validates each platform package with npm publish --dry-run.
          for d in npm/*/; do
            (cd "$d" && npm publish --dry-run --access public) || exit 1
          done
          npm pack --dry-run

  publish:
    needs: [build, package]
    # workflow_dispatch 允许在 npm 反垃圾拦截后从 main 手动慢速重发 (无需新标签)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install napi CLI
        working-directory: bindings/node
        run: npm install --no-save @napi-rs/cli@3.10.8
      - name: Create npm dirs
        working-directory: bindings/node
        run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
      - name: Place binaries into npm dirs
        working-directory: bindings/node
        shell: bash
        run: |
          set -e
          for d in artifacts/bindings-*; do
            node_file=$(ls "$d"/*.node 2>/dev/null | head -1 || true)
            [ -n "$node_file" ] || { echo "no .node in $d"; ls -la "$d"; exit 1; }
            base=$(basename "$node_file")
            placed=0
            for pkg in npm/*/; do
              main=$(jq -r .main "${pkg}package.json")
              if [ "$main" = "$base" ]; then
                cp "$node_file" "$pkg"
                echo "placed $base -> $pkg"
                placed=1
              fi
            done
            [ "$placed" = 1 ] || { echo "no package wants $base"; exit 1; }
          done
          missing=0
          for pkg in npm/*/; do
            main=$(jq -r .main "${pkg}package.json")
            [ -f "$pkg/$main" ] || { echo "MISSING $pkg/$main"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
      - name: Check NPM_TOKEN is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN repository secret is not set — cannot publish to npmjs.org. Create an automation token at https://www.npmjs.com/settings/~/tokens and add it under Settings → Secrets → Actions."
            exit 1
          fi
      - name: Publish platform packages + root
        # 🔑 Plain `npm publish` per package (platform packages first, then the
        # root loader whose optionalDependencies point at them). Auth comes
        # from setup-node's .npmrc + NODE_AUTH_TOKEN. `napi pre-publish` is
        # deliberately NOT used: it assumes a GitHub release flow we don't run.
        # Idempotent + burst-safe: skips packages already on the registry
        # (EPUBLISHCONFLICT would otherwise abort the loop on re-runs) and
        # paces publishes ~3 min apart with retries — npm's anti-spam
        # heuristics reject rapid-fire new-package creation from new accounts.
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          pub() {
            local d="$1" name try
            name=$(jq -r .name "$d/package.json")
            if npm view "$name" version >/dev/null 2>&1; then
              echo "  $name already on npm — skip"; return 0
            fi
            for try in 1 2 3; do
              echo "::group::publish $name (attempt $try)"
              if (cd "$d" && npm publish --access public); then
                echo "::endgroup::"; echo "  published $name"; return 0
              fi
              echo "::endgroup::"
              [ "$try" = 3 ] && break
              echo "  retry in 180s (npm anti-spam/rate heuristics)"; sleep 180
            done
            echo "::error::gave up publishing $name after 3 attempts"
            return 1
          }
          for d in npm/*/; do pub "$d" || exit 1; sleep 90; done
          pub . || exit 1
