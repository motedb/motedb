name: Node SDK publish (npm)

# Multi-platform prebuilt napi binaries → GitHub Packages (npm registry):
#   @motedb/motedb (main) + @motedb/motedb-darwin-arm64 / -darwin-x64 /
#   -linux-x64-gnu / -linux-arm64-gnu / -win32-x64-msvc
# Triggers on v* tags (publish) and PRs touching the binding (build-only).
# 🔑 GitHub Packages needs NO user secret — the built-in GITHUB_TOKEN with
#   packages:write publishes; public packages install without auth via
#   `@motedb:registry=https://npm.pkg.github.com` in the consumer's .npmrc.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "bindings/node/**"
      - ".github/workflows/node-publish.yml"
  workflow_dispatch:

concurrency:
  group: node-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            target: aarch64-apple-darwin
          # x64-macOS via CROSS-COMPILE on the arm64 runner — macos-13
          # (Intel) runners are retiring and queue for an hour+; rust
          # cross-compiles x86_64-apple-darwin natively from arm64.
          - os: macos-latest # arm64 → cross x64
            target: x86_64-apple-darwin
          - os: ubuntu-latest # x64 gnu
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node
          key: ${{ matrix.target }}

      - name: Install napi CLI
        working-directory: bindings/node
        run: npm install --no-save @napi-rs/cli@3.10.8

      - name: Build (napi layout)
        working-directory: bindings/node
        shell: bash
        run: |
          set -e
          ARGS=(--release --platform --target ${{ matrix.target }} --js false --dts false)
          npx napi build "${ARGS[@]}"

      - name: Smoke (JS loader)
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: bindings/node
        shell: bash
        run: |
          # 🔑 require resolves FILE-relative — write the smoke INTO the
          # package dir and require './index.js' (the old /tmp/smoke.js +
          # '../bindings/node' resolved to /bindings/node: MODULE_NOT_FOUND).
          cat > smoke-ci.js <<'JS'
          const Database = require('./index.js');
          const os = require('node:os'), path = require('node:path'), fs = require('node:fs');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'motedb-ci-'));
          const db = new Database(path.join(dir, 't.mote'));
          db.execute('CREATE TABLE t (id INT PRIMARY KEY, emb VECTOR(2), data BLOB)');
          for (let i = 0; i < 10; i++) {
            db.execute('INSERT INTO t VALUES (?, ?, ?)',
              [i, [i, -i], Buffer.from([1, 2, i])]);
          }
          const nn = db.query('SELECT id FROM t ORDER BY emb <-> [5, -5] LIMIT 1');
          if (nn[0].id !== 5) throw new Error('knn ' + JSON.stringify(nn));
          db.checkpoint();
          const again = new Database(path.join(dir, 't.mote'));
          if (again.query('SELECT COUNT(*) AS n FROM t')[0].n !== 10) throw new Error('reopen');
          again.close();
          fs.rmSync(dir, { recursive: true, force: true });
          console.log('smoke OK');
          JS
          node smoke-ci.js && rm -f smoke-ci.js

      - name: Upload binding artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install napi CLI
        working-directory: bindings/node
        run: npm install --no-save @napi-rs/cli@3.10.8
      - name: Create npm dirs
        working-directory: bindings/node
        run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
      - name: Place binaries into npm dirs
        working-directory: bindings/node
        shell: bash
        # 🔑 Deterministic placement (napi artifacts misbehaves with
        # cross-compiled targets): match each downloaded .node against the
        # platform package's "main" field, copy, then verify completeness.
        run: |
          set -e
          for d in artifacts/bindings-*; do
            node_file=$(ls "$d"/*.node 2>/dev/null | head -1 || true)
            [ -n "$node_file" ] || { echo "no .node in $d"; ls -la "$d"; exit 1; }
            base=$(basename "$node_file")
            placed=0
            for pkg in npm/*/; do
              main=$(jq -r .main "${pkg}package.json")
              if [ "$main" = "$base" ]; then
                cp "$node_file" "$pkg"
                echo "placed $base -> $pkg"
                placed=1
              fi
            done
            [ "$placed" = 1 ] || { echo "no package wants $base"; exit 1; }
          done
          missing=0
          for pkg in npm/*/; do
            main=$(jq -r .main "${pkg}package.json")
            [ -f "$pkg/$main" ] || { echo "MISSING $pkg/$main"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          ls -R npm | head -40
      - name: Dry-run publish (structure validation only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: bindings/node
        shell: bash
        run: |
          set -e
          # pre-publish performs REAL npm publishes, so staging (PRs) only
          # validates each platform package with npm publish --dry-run.
          for d in npm/*/; do
            (cd "$d" && npm publish --dry-run --access public) || exit 1
          done
          npm pack --dry-run

  publish:
    needs: [build, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - name: Install napi CLI
        working-directory: bindings/node
        run: npm install --no-save @napi-rs/cli@3.10.8
      - name: Create npm dirs
        working-directory: bindings/node
        run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
      - name: Place binaries into npm dirs
        working-directory: bindings/node
        shell: bash
        run: |
          set -e
          for d in artifacts/bindings-*; do
            node_file=$(ls "$d"/*.node 2>/dev/null | head -1 || true)
            [ -n "$node_file" ] || { echo "no .node in $d"; ls -la "$d"; exit 1; }
            base=$(basename "$node_file")
            placed=0
            for pkg in npm/*/; do
              main=$(jq -r .main "${pkg}package.json")
              if [ "$main" = "$base" ]; then
                cp "$node_file" "$pkg"
                echo "placed $base -> $pkg"
                placed=1
              fi
            done
            [ "$placed" = 1 ] || { echo "no package wants $base"; exit 1; }
          done
          missing=0
          for pkg in npm/*/; do
            main=$(jq -r .main "${pkg}package.json")
            [ -f "$pkg/$main" ] || { echo "MISSING $pkg/$main"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
      - name: Publish platform packages + root
        # 🔑 napi pre-publish IS the publish command: it validates all
        # platform packages, then runs `npm publish` for each + the root.
        # GitHub Packages: the built-in GITHUB_TOKEN suffices (packages:write
        # above). A future npmjs.com mirror: add NPM_TOKEN + a second pass
        # with registry-url: https://registry.npmjs.org (same scoped names,
        # requires the @motedb scope to exist under the publishing account).
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/napi pre-publish -p npm
