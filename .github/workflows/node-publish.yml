name: Node SDK publish (npm)

# Multi-platform prebuilt napi binaries → npm optional packages:
#   motedb (main) + motedb-darwin-arm64 / -darwin-x64 /
#   motedb-linux-x64-gnu / -linux-arm64-gnu / -win32-x64-msvc
# Triggers on v* tags (publish) and PRs touching the binding (build-only).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "bindings/node/**"
      - ".github/workflows/node-publish.yml"
  workflow_dispatch:

concurrency:
  group: node-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            target: aarch64-apple-darwin
          - os: macos-13 # x64
            target: x86_64-apple-darwin
          - os: ubuntu-latest # x64 gnu
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node
          key: ${{ matrix.target }}

      - name: Install napi CLI
        working-directory: bindings/node
        run: npm install --no-save @napi-rs/cli@3.10.8

      - name: Build (napi layout)
        working-directory: bindings/node
        shell: bash
        run: |
          set -e
          ARGS=(--release --platform --target ${{ matrix.target }} --js false --dts false)
          if [[ "${{ matrix.target }}" == x86_64-unknown-linux-gnu ]]; then
            # musl-free runners: keep default gnu toolchain
            ARGS+=(--cargo-flags="--features jemalloc")
          fi
          npx napi build "${ARGS[@]}"

      - name: Smoke (JS loader)
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: bindings/node
        shell: bash
        run: |
          cat > /tmp/smoke.js <<'JS'
          const Database = require('../bindings/node');
          const os = require('node:os'), path = require('node:path'), fs = require('node:fs');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'motedb-ci-'));
          const db = new Database(path.join(dir, 't.mote'));
          db.execute('CREATE TABLE t (id INT PRIMARY KEY, emb VECTOR(2), data BLOB)');
          for (let i = 0; i < 10; i++) {
            db.execute('INSERT INTO t VALUES (?, ?, ?)',
              [i, [i, -i], Buffer.from([1, 2, i])]);
          }
          const nn = db.query('SELECT id FROM t ORDER BY emb <-> [5, -5] LIMIT 1');
          if (nn[0].id !== 5) throw new Error('knn ' + JSON.stringify(nn));
          db.checkpoint();
          const again = new Database(path.join(dir, 't.mote'));
          if (again.query('SELECT COUNT(*) AS n FROM t')[0].n !== 10) throw new Error('reopen');
          again.close();
          fs.rmSync(dir, { recursive: true, force: true });
          console.log('smoke OK');
          JS
          node /tmp/smoke.js

      - name: Upload binding artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install napi CLI
        working-directory: bindings/node
        run: npm install --no-save @napi-rs/cli@3.10.8
      - name: Create npm dirs
        working-directory: bindings/node
        run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
      - name: Place binaries into npm dirs
        working-directory: bindings/node
        shell: bash
        run: |
          set -e
          for d in artifacts/bindings-*; do
            target="${d#artifacts/bindings-}"
            npx napi artifacts "$d" --target "$target"
          done
          ls -R npm | head -40
      - name: Dry-run publish (structure validation only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: bindings/node
        shell: bash
        run: |
          set -e
          # pre-publish performs REAL npm publishes, so staging (PRs) only
          # validates each platform package with npm publish --dry-run.
          for d in npm/*/; do
            (cd "$d" && npm publish --dry-run --access public) || exit 1
          done
          npm pack --dry-run

  publish:
    needs: [build, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install napi CLI
        working-directory: bindings/node
        run: npm install --no-save @napi-rs/cli@3.10.8
      - name: Create npm dirs
        working-directory: bindings/node
        run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
      - name: Place binaries into npm dirs
        working-directory: bindings/node
        shell: bash
        run: |
          set -e
          for d in artifacts/bindings-*; do
            target="${d#artifacts/bindings-}"
            npx napi artifacts "$d" --target "$target"
          done
      - name: Publish platform packages + root
        # 🔑 napi pre-publish IS the publish command: it validates all
        # platform packages, then runs `npm publish` for each + the root.
        # Requires the NPM_TOKEN secret (automation token, npmjs.com →
        # motedb → Access Tokens → Generate). Without it this job fails
        # with ENEEDAUTH.
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./node_modules/.bin/napi pre-publish -p npm
